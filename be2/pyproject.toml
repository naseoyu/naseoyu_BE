[build-system]
requires=["setuptools>=70"]
build-backend="setuptools.build_meta"
[project]
name="dc-be2-backend"
version="1.1.0"
description="BE2 API, persistence, durable jobs and SSE for the data center agent"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1","uvicorn>=0.30,<1","pydantic>=2.7,<3","pydantic-settings>=2.3,<3","sqlalchemy>=2,<3","alembic>=1.14,<2","python-multipart>=0.0.20,<0.1"]
[project.optional-dependencies]
postgres=["psycopg[binary]>=3.2,<4"]
test=["pytest>=8,<10","httpx>=0.27,<1"]
[project.scripts]
be2="be2_backend.cli:main"
[tool.setuptools.packages.find]
include=["be2_backend*"]
[tool.setuptools.package-data]
be2_backend=["migrations/*.py","migrations/*.mako","migrations/versions/*.py"]
[tool.pytest.ini_options]
testpaths=["tests"]
